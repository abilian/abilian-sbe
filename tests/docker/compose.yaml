# Run the test suite against MariaDB, both in containers. See README.md.
services:
  mariadb:
    image: mariadb:11.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: sbe_test
      MARIADB_USER: sbe
      MARIADB_PASSWORD: sbe
    # Throwaway data: every `down` starts the next run from an empty database.
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 30

  tests:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile
    environment:
      SQLALCHEMY_DATABASE_URI: mysql+pymysql://sbe:sbe@mariadb/sbe_test?charset=utf8mb4
    depends_on:
      mariadb:
        condition: service_healthy
