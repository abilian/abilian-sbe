# Hop3 deployment configuration for Abilian SBE.
#
# Deploys natively (Python toolchain + Node for the Vite build).
# NOTE: the repo contains a stub Dockerfile (CMD is `echo OK`) which would
# otherwise auto-select the Docker builder, hence builder = "local".

[metadata]
id = "abilian-sbe"
name = "Abilian SBE"
description = "Abilian Social Business Engine"

[build]
builder = "local"

# Python only, declared rather than detected. Hop3 finds pyproject.toml *and*
# package.json and calls the result "multi-language", which no deployer on this
# server claims -- the build succeeds and then nothing will run it. The Node
# markers are misleading anyway: the root package.json holds `markdown-toc`, a
# docs tool, and vite/ is a build-time concern the server has no reason to run.
toolchain = "python"

# So the Vite assets are built locally and ride along in the upload -- `hop3
# deploy` sends gitignored files, and src/abilian/sbe/static/vite/ is ignored
# but generated. That trades a build-time Node toolchain for a step someone can
# forget, so fail loudly rather than serve a page with no CSS.
before-build = "test -f src/abilian/sbe/static/vite/main.js || { echo 'Vite assets missing: run `make front` before deploying' >&2; exit 1; }"

[run]
# Every command runs behind scripts/hop3-env.sh, which translates the
# addon-injected DATABASE_URL and REDIS_URL into the FLASK_* names this app
# reads through `from_prefixed_env()`. Hop3 does not interpolate in `[env]`, so
# it cannot be done there.
#
# initdb is idempotent (create_all + create-if-absent root user), and so are
# both backfills. backfill-community-roles is REQUIRED as of the release that
# records community memberships as roles on the community: until it runs, every
# existing community manager loses MANAGE. It ships with that code, so it
# cannot run any earlier than this.
before-run = 'sh scripts/hop3-env.sh sh -c "flask initdb && flask backfill-community-roles && flask backfill-creator-memberships"'
start = 'sh scripts/hop3-env.sh gunicorn wsgi:app -b 0.0.0.0:$PORT --workers 4 --log-level info --access-logfile - --error-logfile -'

[run.workers]
worker = 'sh scripts/hop3-env.sh flask worker'       # dramatiq (flask-dramatiq)
scheduler = 'sh scripts/hop3-env.sh flask scheduler'

[deploy]
# Hop3 detects Python and Node from pyproject.toml and vite/package.json and
# calls the artifact "multi-language", which no deployer claims — the build
# succeeds and then there is nothing to run it. Both toolchains are wanted (the
# Vite output is generated at build time, not committed), so the fix is to name
# the deployer rather than to drop a toolchain. This is a WSGI app either way:
# `wsgi:app` is a plain WSGI callable, whether uwsgi runs [run].start or loads
# it itself.
#
# NOTE 2026-09-08: hop3-dev.abilian.com ignored this — the deploy failed with
# the identical "No deployer found for artifact kind 'multi-language'". The key
# is in the schema this repo's hop3check validates against, so the server is
# probably running an older Hop3. Left in place: harmless there, correct once
# it is upgraded.
deployer = "uwsgi"

[[addons]]
type = "postgres"

[[addons]]
type = "redis"

[env]
# Generated once on first deploy; never committed.
FLASK_SECRET_KEY = { generate = "hex", length = 64 }
# The app reads config via from_prefixed_env() (FLASK_* -> config keys).
# Defaults: PRODUCTION = False, TALISMAN_FORCE_HTTPS = True (correct behind
# Hop3's TLS-terminating nginx).
FLASK_PRODUCTION = "true"

[[volumes]]
name = "instance"
target = "instance" # uploads, whoosh index, tmp; survives redeploys

[healthcheck]
path = "/"
# `main.home` renders a template, so an anonymous GET / is a 200 -- but a 200
# alone can be nginx's default_server or an error page, so match on something
# only this app serves. This is the h1 in web/templates/index.html, a literal
# rather than a `_()` string, so it does not move with the locale or SITE_NAME.
# Change it if that heading changes, or the deploy will wait for readiness that
# never arrives.
contains = "Welcome to Abilian!"
