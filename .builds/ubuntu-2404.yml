image: ubuntu/24.04

secrets:
  - b88a4c2c-944c-42a6-9fbb-7483049c458a

packages:
  # Build tools
  - software-properties-common
  - build-essential
  - make
  - gcc
  - g++
  # Python 3.12
  - python3-dev
  - python3-pip
  - python3-wheel
  - pipx
  # Librairies for DB connectors
  - libsqlite3-dev
  - libpq-dev
  - libmariadb-dev
  # More libraries
  - libbz2-dev
  - libffi-dev
  - libjpeg-dev
  - libjpeg-turbo8-dev
  - libxslt-dev
  - libxslt1-dev
  # Other deps
  - strace
  - poppler-utils
  - libreoffice
  - default-jdk-headless
  - curl

tasks:
  - setup: |
      # Not `sudo pip install`: it can't upgrade Debian's own packages.
      pipx install uv
      # Ubuntu's Node 18 is too old for Vite 7 and Tailwind 4.
      curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
      sudo apt-get install -y nodejs
      cd abilian-sbe*
      npm install
      make front

  # nox runs through uv, on the Python version that requires-python allows.
  - lint-nox: |
      export PATH=$HOME/.local/bin:$PATH
      cd abilian-sbe*
      uvx --python 3.13 nox -e lint

  - test-nox: |
      export PATH=$HOME/.local/bin:$PATH
      cd abilian-sbe*
      uvx --python 3.13 nox -e pytest-3.13
