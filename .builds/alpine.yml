# Latest stable release
image: alpine/latest

packages:
  # Build
  - gcc
  - rust
  - cargo
  - maturin
  # Libraries
  - musl-dev
  - libffi-dev
  - libjpeg-turbo-dev
  - libxslt-dev
  - postgresql-dev
  # Python dev
  - python3-dev
  - py3-tox
  - py3-pip
  - uv
  # - poetry
  # Node
  - nodejs-dev
  - npm
  # Other deps
  - curl
  - poppler-utils
  # Docker-based tests (tests/docker/)
  - docker
  - docker-cli-compose

tasks:
  - setup: |
      cd abilian-sbe
      npm install
      # Each task is a new login, so the group applies from the next task on.
      sudo addgroup build docker
      sudo service docker start

  # Alpine's py3-nox lacks its attrs dependency, and Alpine's Python (3.14)
  # is outside requires-python: run nox through uv, on Python 3.13.
  - lint-nox: |
      cd abilian-sbe
      uvx --python 3.13 nox -e lint

  - test-nox: |
      cd abilian-sbe
      uvx --python 3.13 nox -e pytest-3.13

  - test-mariadb-docker: |
      cd abilian-sbe
      make test-mariadb-docker

  - test-postgres-docker: |
      cd abilian-sbe
      make test-postgres-docker
