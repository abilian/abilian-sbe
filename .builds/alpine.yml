# Latest stable release
image: alpine/latest

packages:
  # Build
  - gcc
  - rust
  - cargo
  - maturin
  # Libraries
  - musl-dev
  - libffi-dev
  - libjpeg-turbo-dev
  - libxslt-dev
  - postgresql-dev
  # Python dev
  - python3-dev
  - py3-tox
  - py3-nox
  - py3-pip
  - uv
  # - poetry
  # Node
  - nodejs-dev
  - npm
  # Other deps
  - curl
  - poppler-utils
  # Docker-based tests (tests/docker/)
  - docker
  - docker-cli-compose

tasks:
  - setup: |
      cd abilian-sbe
      npm install
      # Each task is a new login, so the group applies from the next task on.
      sudo addgroup build docker
      sudo service docker start

  - lint-nox: |
      cd abilian-sbe
      nox -e lint

  - test-nox: |
      cd abilian-sbe
      # Default Python version is python 3.12
      # TODO: install other versions using rye
      nox -e pytest-3.12

  - test-mariadb-docker: |
      cd abilian-sbe
      make test-mariadb-docker

  - test-postgres-docker: |
      cd abilian-sbe
      make test-postgres-docker
