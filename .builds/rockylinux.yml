image: rockylinux/latest

packages:
  # Python
  - python3.12
  - python3.12-pip
  - python3.12-devel
  # Build tools
  - make
  - gcc
  - npm
  # Libraries
  - libpq-devel
  - mariadb-connector-c-devel
  # Docker and friends (NB: docker is not available on Rocky Linux)
  - buildah
  # Dependencies for buildah
  - passt-selinux


tasks:
  - setup: |
      sudo pip3.12 install -U uv
      cd abilian-sbe
      uv sync
      npm install
      make front

  - lint: |
      cd abilian-sbe
      uv run make lint

  - test: |
      cd abilian-sbe
      uv run make test

  # nox runs through uv, on the Python version that requires-python allows.
  - nox-lint: |
      cd abilian-sbe
      uvx --python 3.13 nox -e lint

  - nox-test: |
      cd abilian-sbe
      uvx --python 3.13 nox -e pytest-3.13

  - buildah: |
      cd abilian-sbe
      buildah build .
