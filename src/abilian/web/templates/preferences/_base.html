{% extends "base.html" %}

{% from "macros/box.html" import m_box_menu %}

{% block main %}
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
    <div class="lg:col-span-3">
      {%- call m_box_menu(_("Preferences")) %}
        <nav class="menu-nav">
          {%- for entry in menu %}
            <a class="menu-nav-item{% if entry.active %} is-active{% endif %}"
                href="{{ entry.url }}">
              {{ entry.label }}
            </a>
          {%- endfor %}
        </nav>
      {%- endcall %}
    </div>

    <div class="lg:col-span-9">
      {% block content %}
      {% endblock %}
    </div>
  </div>
{% endblock %}
