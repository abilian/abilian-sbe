{% if obj %}
  {% set doc = obj %}
{% endif %}
<dialog class="modal" id="modal-upload-new-version">
  <div class="modal-dialog relative mx-auto my-8 max-w-lg">
    <div class="modal-content bg-white rounded-lg shadow-xl">
      <form id="fileupload" class="modal-replacedoc-form" action="" method="POST" enctype="multipart/form-data">
        {{ csrf.field() }}

        <div class="modal-header flex items-center justify-between p-4 border-b border-gray-200">
          <h2 class="modal-title text-lg font-semibold text-gray-900">{{ _("Upload new version") }}</h2>
          <button type="button" class="text-gray-400 hover:text-gray-500" data-modal-close>&times;</button>
        </div>

        <div class="modal-body p-4">
          <div class="mb-4">
            <input type="file" name="file" aria-label="{{ _('Replace') }}"
                   class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-medium file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"/>
          </div>
        </div>

        <div class="modal-footer flex justify-end gap-2 p-4 border-t border-gray-200">
          <button data-modal-close type="button"
                  class="btn btn-default">
            {{ _("Cancel") }}
          </button>
          <button class="btn btn-primary"
                  type="submit">
            {{ _("Upload") }}
          </button>
        </div>
      </form>
    </div>
  </div>
</dialog>
