<dialog class="modal" id="modal-upload-files"
        data-error-upload="{{ _('Error - File not uploaded') }}"
        data-error-too-large="{{ _('Error: maximum file size exceeded') }}">
  <div class="modal-dialog relative mx-auto my-8 max-w-lg">
    <div class="modal-content bg-white rounded-lg shadow-xl">
      <form method="POST" action="{{ folder_post_url }}" enctype="multipart/form-data">
        {{ csrf.field() }}

        <div class="modal-header flex items-center justify-between p-4 border-b border-gray-200">
          <h2 class="modal-title text-lg font-semibold text-gray-900">{{ _("Upload new files") }}</h2>
          <button type="button" class="text-gray-400 hover:text-gray-500" data-modal-close>&times;</button>
        </div>

        <div class="modal-body p-4">
          <div class="btn-file inline-flex items-center px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50 cursor-pointer">
            <span class="fa fa-plus mr-2"></span>
            <span>{{ _('Add files to selection') }}</span>
            <input name="file" type="file" multiple aria-label="{{ _('Add files to selection') }}" class="absolute inset-0 opacity-0 cursor-pointer">
          </div>

          <template class="js-file-tpl">
            <li class="border border-gray-200 rounded-lg p-3">
              <div class="flex items-start gap-x-4">
                <div class="w-10 h-10 shrink-0 bg-gray-100 rounded overflow-hidden">
                  <img class="js-file-preview w-full h-full object-cover" alt="" hidden>
                </div>

                <div class="flex-1 min-w-0">
                  <h4 class="js-file-name text-sm font-medium text-gray-900 truncate"></h4>
                  <span class="js-file-size text-xs text-gray-500"></span>
                  <p class="js-file-error text-sm text-red-600" hidden></p>
                </div>

                <div class="flex items-center gap-x-2">
                  <div class="js-file-progress w-24" hidden>
                    <div class="h-2 bg-gray-200 rounded-full overflow-hidden">
                      <div class="h-full bg-blue-600 rounded-full transition-all" role="progressbar"
                           style="width: 0%;"></div>
                    </div>
                  </div>

                  <span class="js-file-sent fa fa-check text-green-600" hidden></span>
                  <span class="js-file-failed fa fa-exclamation-triangle text-red-600" hidden></span>

                  <button type="button"
                          class="js-file-remove inline-flex items-center justify-center w-8 h-8 text-white bg-red-600 rounded-md hover:bg-red-700"
                          aria-label="{{ _('Remove') }}">
                    <span class="fa fa-minus"></span>
                  </button>
                </div>
              </div>
            </li>
          </template>

          <ul class="js-files mt-4 space-y-2"></ul>

          <div class="js-total-progress mt-4 h-2 bg-gray-200 rounded-full overflow-hidden" hidden>
            <div class="h-full bg-blue-600 rounded-full transition-all" role="progressbar"
                 style="width: 0;"></div>
          </div>

          <div class="mt-4">
            <label class="flex items-center">
              <input type="checkbox" name="uncompress_files" value="true"
                     class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500"/>
              <span class="ml-2 text-sm text-gray-700">{{ _('Uncompress ZIP files') }}</span>
            </label>
          </div>
        </div>

        <div class="modal-footer flex justify-end gap-2 p-4 border-t border-gray-200">
          <button data-modal-close type="button"
                  class="btn btn-default">
            {{ _("Cancel") }}
          </button>
          <button type="button" hidden
                  class="js-upload inline-flex items-center px-4 py-2 text-sm font-medium text-white bg-green-600 rounded-md hover:bg-green-700 cursor-pointer">
            {{ _("Upload") }}
          </button>
        </div>
      </form>
    </div>
  </div>
</dialog>
