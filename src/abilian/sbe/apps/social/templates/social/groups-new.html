{% extends "social/base.html" %}

{% from "social/macros.html" import render_field %}

{% block content %}
  <h2 class="text-xl font-semibold text-gray-900 mb-6">{{ _("Create a new group") }}</h2>

  <form action="{{ request.path }}" method="POST" id="edit-form" class="space-y-6">
    {{ form.csrf }}

    <fieldset class="space-y-4">
      {%- for field in form %}
        {{ render_field(field) }}
      {%- endfor %}
    </fieldset>

    <div class="flex gap-2 pt-4 border-t border-gray-200">
      {%- if for_new %}
        <button type="submit" class="btn btn-primary"
                name="_action" value="add">Add new</button>
        <button type="submit" class="btn btn-default"
                name="_action" value="cancel">Cancel</button>
      {%- else %}
        <button type="submit" class="btn btn-primary"
                name="_action" value="save">Save changes</button>
        <button type="submit" class="btn btn-default"
                name="_action" value="cancel">Cancel</button>
      {%- endif %}
    </div>

  </form>


{% endblock %}
