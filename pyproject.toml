[project]
name = "abilian-sbe"
version = "1.2.0"
description = "Social Business platform (entreprise collaboration and information management)"
readme = "README.md"
requires-python = ">=3.12"
license = "LGPL-2.0-or-later"
authors = [{ name = "Abilian SAS", email = "sales@abilian.com" }]
dependencies = [
    # Flask and friends
    "flask>=3.1.0",
    "jinja2>=3.1.3",
    "werkzeug>=3.1.0",
    "markupSafe>=2.1.4",
    # Flask extensions
    "flask-babel>=1.0.0,<2.0.0",
    "flask-mail>=0.9.1",
    "flask-migrate>=4.0.5",
    "flask-login>=0.6.3",
    "flask-super>=0.2.8",
    "flask-talisman>=1.1.0",
    # Transitive dependencies, but called explicitly in our code
    "Babel",
    "blinker>=1.6.2",
    "click>=8.1.3",
    "itsdangerous>=2.1.2",
    "pytz",
    # Persistence
    "sqlalchemy>=2.0,<2.1",
    "flask-sqlalchemy>=3.1,<3.2",
    "pymysql>=1.1.0,<2.0.0",
    # Forms
    "flask-wtf>=1.2.0",
    "wtforms>=3.1.2",
    "WTForms-Alchemy>=0.18.0",
    "wtforms-sqlalchemy>=0.4.1",
    #
    "python-dateutil>=2.8.2",
    # Search
    "whoosh-reloaded>=2.7.5,<3.0.0",
    # task queue
    "dramatiq>=1.15.0",
    "redis>=4.6.0",
    "flask-dramatiq>=0.6.0",
    "dramatiq-abort>=1.1.0,<2.0.0",
    "apscheduler>=3.10.4,<4.0.0",
    # Infra
    "loguru>=0.7.2,<0.8.0",
    "filelock>=3.15",
    # Security
    "bleach[css]>=6.2.0,<7.0.0",
    "bcrypt==4.3.0",             # current version 5.0.0 need to be tested on Slapos
    "defusedxml>=0.7.1,<0.8.0",
    # Various libs
    "deprecated>=1.3.1",
    "tqdm",
    "python-magic",
    "pillow",
    "validate_email",
    "toolz",
    "html2text>=2024",
    "svcs>=24.1.0",
    "attrs>=24.2.0",
    # Markdown support for Wiki
    "markdown>=3,<4",
    # Language and charset detection
    "langid>=1.1.6",
    "chardet",
    # XLSX support
    "xlwt",
    "openpyxl",
    # Dev and prod server
    "gunicorn",
    "sentry-sdk[flask]",
    # Geoip DB
    "maxminddb",
    # Only used by the (disabled) update_ip_country.py script
    # "certifi",
    # "mmdb_writer",
    # "netaddr",
    #
    "pytest>=8.3.3",
    "hyperlink>=21.0.0",
    "python-dotenv>=1.2.4",
    "flask-vite>=0.6.1",
]

[project.urls]
Repository = "https://github.com/abilian/abilian-sbe"

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abilian"]
# The Vite build output is gitignored, and hatchling honours VCS ignores, so it
# has to be force-included. Shipping it means `pip install abilian-sbe` yields a
# styled app with no Node and no build step at deploy time. Run `make front`
# before building a wheel.
artifacts = ["src/abilian/sbe/static/vite/*"]

[dependency-groups]
doc = [
    # Documentation
    "mkdocs-material>=9.5.4,<10.0.0",
]
dev = [
    # The PostgreSQL driver is an extra, which a plain `uv sync` leaves out:
    # development runs against PostgreSQL, so the dev group asks for it.
    "abilian-sbe[postgres]",
    "abilian-devtools",
    # "flask-debugtoolbar",
    # "sqlparse>=0.4.4,<0.5.0",
    # Dev server
    "honcho",
    # Testing
    "html5lib",
    "hyperlink",
    "pytest>=8.3.3",
    "tox>=4.5.1",
    "pytest-flask",
    "flask-linktester",
    "pillow>=13.0.0",   # to replace imghdr
    # Type hints
    "types-bleach",
    "types-deprecated",
    "types-python-dateutil",
    "types-pytz",
    "types-pyyaml",
    "types-redis",
    "types-requests",
    "types-setuptools",
    "types-chardet",
    "types-Markdown",
    "types-toml>=0.10.8.7,<0.11.0.0",
    # Tools
    "pyupgrade",
    "deptry",
    "flynt>=1.0.1",
    "snoop>=0.6.0",
    "pytest-archon>=0.0.6",
    "typeguard>=4.4.1",
    "auto-type-annotate>=1.1.1",
    "ty>=0.0.0a7",
    "pyrefly>=0.32.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    "nox>=2026.8.17",
    "pre-commit>=4.6.2",
    "import-linter>=2.15",
    "zuban>=0.10.2",
    "abilian-ds==0.3.0",
]

[tool.uv]
default-groups = ["doc", "dev"]

[tool.pytest.ini_options]
minversion = "6.0"
filterwarnings = [
    'ignore::DeprecationWarning',
    'ignore::sqlalchemy.exc.SAWarning',
    # Later entries win. An object left out of the session is never saved.
    'error:Object of type .* not in session:sqlalchemy.exc.SAWarning',
]
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
python_files = ["test_*.py", "tests.py", "test.py", "*_tests.py"]
# norecursedirs = .* env* _build *.egg *.egg-info tools deploy etc docs demo bin

# -----------------------------------------------------------------------------


[tool.deptry.per_rule_ignores]
# X defined as a dependency but not used in the codebase
DEP002 = [
    # Used by Flask
    "python-dotenv",
    # Database drivers: SQLAlchemy loads them from the database URL
    'pymysql',
    'psycopg2-binary',
    # Web
    'gunicorn',
]

# X imported but missing from the dependency definitions
DEP001 = [
    'pkg_resources',
    # Optional: antivirus scanning no-ops when clamd is absent, and the package
    # is useless without a clamav daemon listening on the host's unix socket.
    'clamd',
    # Optional too: the toolbar panels are orphaned and setup/debug.py guards
    # its import, so it is not declared as a dependency at all.
    'flask_debugtoolbar',
]

# X imported but declared as a dev dependency
DEP004 = ['html5lib']

# -----------------------------------------------------------------------------


[tool.pyright]
exclude = ['.nox', 'tests', 'noxfile.py']
include = ["src"]
# strict = ["src"]

# False positives
reportPrivateImportUsage = false

# -----------------------------------------------------------------------------

[tool.zuban]
python_version = "3.12"
ignore_missing_imports = true

# -----------------------------------------------------------------------------

[tool.pyrefly]
python-version = "3.12"
ignore-missing-imports = ["*"]
# nothing

[tool.tepyd]
# Generated by `tepyd init` — review and adjust.
src_root = "src/abilian"
src_package = "abilian"
units = ["*"]
# counter = "internal"   # or "cloc"

# Source units to exclude from analysis (a reason is required):
# [tool.tepyd.exclude]
# faker = "why this is not tested"

# Tiers, cheapest first. Add `expects = [...]` to a tier to scope it to
# the source units it should test (glob patterns over unit names); units
# outside the scope are reported n/a, not as gaps. Use it when layers map
# to tiers — e.g. integration `expects = ["repositories/*", "infra/*"]`,
# e2e `expects = ["web/*"]`. Omit it and the tier is checked against all.

[[tool.tepyd.tiers]]
name = "a_unit"
root = "tests/a_unit"
label = "unit"
target_share = 0.6

[[tool.tepyd.tiers]]
name = "b_integration"
root = "tests/b_integration"
label = "integration"

[[tool.tepyd.tiers]]
name = "integration"
root = "tests/integration"
label = "integration"

[[tool.tepyd.tiers]]
name = "c_e2e"
root = "tests/c_e2e"
label = "e2e"

[[tool.tepyd.tiers]]
name = "core"
root = "tests/core"
label = "core"

[[tool.tepyd.tiers]]
name = "sbe"
root = "tests/sbe"
label = "sbe"

[[tool.tepyd.tiers]]
name = "services"
root = "tests/services"
label = "services"

[[tool.tepyd.tiers]]
name = "web"
root = "tests/web"
label = "web"

# -----------------------------------------------------------------------------

[tool.importlinter]
root_package = "abilian"
include_external_packages = true

# `allow_indirect_imports` throughout: the rule is "this module does not itself
# reach for the framework", not "nothing it calls ever touches Flask" -- the
# latter is untrue by construction, since the seam below imports Flask on
# everyone's behalf.

[[tool.importlinter.contracts]]
name = "The policy engine does not know it is running on Flask"
type = "forbidden"
source_modules = ["abilian.services.security.service"]
forbidden_modules = ["flask", "flask_login"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Domain models take their subject, they do not reach for one"
type = "forbidden"
source_modules = ["abilian.core.models.owned"]
forbidden_modules = ["flask", "flask_login"]
allow_indirect_imports = true

[tool.abilian-ds]
# `abilian-ds sync` writes ADS's files here; nobody edits them by hand. `abilian-ds lint`
# checks the markup of the templates listed, and the stylesheets. App templates join the
# list as they move to ADS.
theme = "src/abilian/sbe/static/ads"
components = "src/abilian/sbe/templates/ads"
templates = ["mockups/templates", "src/abilian/sbe/templates/ads_base.html", "src/abilian/sbe/templates/ads_macros.html", "src/abilian/sbe/templates/ads_community.html", "src/abilian/sbe/templates/main", "src/abilian/sbe/apps/wall/templates/wall/index.html"]
stylesheet = [
    "src/abilian/sbe/static/ads/ads.css",
    "src/abilian/sbe/static/theme.css",
]
